# syntax=docker/sandbox-kit:3
# SPDX-License-Identifier: Apache-2.0
# Mixin layered on the built-in `claude` kit: `sbx create claude --kit build/sbx-kit/varco-toolchain …`
# (ADR-0019 § 5). Assemble it with `make sbx-kit`.
schemaVersion: "3"
kind: mixin
displayName: Varco toolchain

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - repo.maven.apache.org:443
          - registry.npmjs.org:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: /usr/local/share/varco/install.sh
          user: "0"
          env: [WORKSPACE_DIR]
