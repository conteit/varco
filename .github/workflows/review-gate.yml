# SPDX-License-Identifier: Apache-2.0
# Posts the `review-gate` commit status (ADR-0016 section 5). Never checks out PR code:
# the evaluator comes from the default branch and all PR data is fetched with the API.
name: Review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI, Commit hygiene, No AI attribution, No scratch docs, PR body lint]
    types: [completed]

permissions: {}

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-gate-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      - if: env.PR == ''
        run: echo "No pull request attached to this event; nothing to evaluate."
      - if: env.PR != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/agents
      - if: env.PR != ''
        name: Evaluate and post status
        run: |
          pages() { gh api --paginate --slurp "$1" | jq -c "$2"; }
          pr="$(gh api "repos/$REPO/pulls/$PR")"
          sha="$(jq -r .head.sha <<<"$pr")"
          ref="$(jq -r '.body // "" | [match("(closes|fixes|resolves|part of) #([0-9]+)"; "gi").captures[1].string] | first // empty' <<<"$pr")"
          issue=null
          [ -z "$ref" ] || issue="$(gh api "repos/$REPO/issues/$ref" 2>/dev/null || echo null)"
          checks="$(pages "repos/$REPO/commits/$sha/check-runs" '[.[].check_runs[] | {name, result: .conclusion}]')"
          statuses="$(gh api "repos/$REPO/commits/$sha/status" | jq -c '[.statuses[] | {name: .context, result: .state}]')"
          state="$(jq -n \
            --argjson pr "$pr" --argjson issue "$issue" --argjson checks "$checks" --argjson statuses "$statuses" \
            --argjson reviews "$(pages "repos/$REPO/pulls/$PR/reviews" 'add // []')" \
            --argjson files "$(pages "repos/$REPO/pulls/$PR/files" 'add // []')" \
            --argjson events "$(pages "repos/$REPO/issues/$PR/events" 'add // []')" \
            '{pr: $pr, issue: $issue, reviews: $reviews, files: $files, events: $events, checks: ($checks + $statuses)}')"
          rc=0
          out="$(scripts/agents/review-gate.sh --owner "$OWNER" --budget 600 <<<"$state")" || rc=$?
          echo "$out"
          case "$rc" in 0) s=success ;; 1) s=failure ;; *) s=error; out="invalid gate input" ;; esac
          gh api "repos/$REPO/statuses/$sha" -f state="$s" -f context=review-gate \
            -f description="$(printf '%s' "$out" | head -n1 | cut -c1-140)"
