name: Disagreement with a merged change
description: Post-merge human review — something an agent merged should change or be reverted.
title: "[disagreement] "
labels: ["disagreement"]
body:
  - type: input
    id: pr
    attributes: { label: Pull request, description: "Link or #number of the merged PR" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What I disagree with and why }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Desired outcome, description: "What the code/behaviour should be instead (acceptance criteria welcome)" }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes: { label: Severity, options: ["low", "medium", "high", "security"] }
    validations: { required: true }
  - type: dropdown
    id: revert
    attributes: { label: Revert first?, options: ["no — fix forward", "yes — revert, then redo"] }
    validations: { required: true }
